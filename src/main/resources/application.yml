server:
  port: ${SERVER_PORT:18200}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:18210}

spring:
  application:
    name: pfm-core-ledger-java
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/pfm_core_ledger}
    username: ${DB_USERNAME:pfm_app_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000
      keepalive-time: 30000
      max-lifetime: 600000
      auto-commit: false
      data-source-properties:
        prepareThreshold: 3
        preparedStatementCacheQueries: 256
        preparedStatementCacheSizeMiB: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://localhost:15432/pfm_core_ledger}}
    user: ${FLYWAY_USER:postgres}
    password: ${FLYWAY_PASSWORD:}
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

resilience4j:
  circuitbreaker:
    instances:
      coreLedger:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      coreLedger:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        enableRandomizedWait: true
  timelimiter:
    instances:
      coreLedger:
        timeoutDuration: 3s
        cancelRunningFuture: true
  bulkhead:
    instances:
      coreLedger:
        maxConcurrentCalls: 64
        maxWaitDuration: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${DD_TRACE_SAMPLE_RATE:1.0}
    propagation:
      type: W3C
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:https://otel-collector.pfm.internal:4318}/v1/traces

datadog:
  service: ${DD_SERVICE:pfm-core-ledger-java}
  env: ${DD_ENV:local}
  version: ${DD_VERSION:0.1.0}
  logs-injection: ${DD_LOGS_INJECTION:true}
  site: ${DD_SITE:us3.datadoghq.com}
  cloudwatch-logs-enabled: ${CLOUDWATCH_LOGS_ENABLED:false}
